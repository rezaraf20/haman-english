<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haman English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12213B; --ink-2:#1B3054; --paper:#F6F2E9; --paper-2:#FFFFFF;
  --amber:#C98A2C; --amber-deep:#8F5E12; --teal:#2E6E6B; --teal-deep:#1E4A48;
  --line:#DED6C2; --text:#12213B; --text-mut:#5B6478; --danger:#B4432E;
  --bg: var(--paper); --card: var(--paper-2); --fg: var(--text); --fg-mut: var(--text-mut);
  --border: var(--line); --accent: var(--amber); --accent-fg: var(--amber-deep);
  --header-fg:#F6F2E9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1626; --card:#16213A; --fg:#EDE7D9; --fg-mut:#9AA3B8; --border:#28324A; --accent-fg:#E0A94F; --teal-deep:#7FC4C0; --danger:#E3735C; }
}
:root[data-theme="dark"]{ --bg:#0E1626; --card:#16213A; --fg:#EDE7D9; --fg-mut:#9AA3B8; --border:#28324A; --accent-fg:#E0A94F; --teal-deep:#7FC4C0; --danger:#E3735C; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{ margin:0; background:var(--bg); color:var(--fg); font-family:'Vazirmatn',sans-serif; line-height:1.9; -webkit-font-smoothing:antialiased; }
.wrap{max-width:480px;margin:0 auto;padding:0 18px 48px}
header.top{ background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%); color:var(--header-fg); padding:22px 18px calc(16px + env(safe-area-inset-top,0px)); margin-bottom:-16px; position:relative; }
header.top .row{display:flex;justify-content:space-between;align-items:flex-start;max-width:480px;margin:0 auto}
.brand{font-size:20px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font-size:12px;font-weight:400;color:#C9BFA0;margin-top:2px}
.streak{text-align:left; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:14px; padding:8px 14px; min-width:64px;}
.streak .num{font-size:20px;font-weight:700;color:var(--amber)}
.streak .lbl{font-size:11px;color:#C9BFA0;margin-top:1px}
.progressbar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin-top:16px;overflow:hidden}
.progressbar > div{height:100%;background:var(--amber);border-radius:6px;transition:width .4s ease}
.progress-lbl{font-size:12px;color:#C9BFA0;margin-top:6px}
.tabbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:480px;margin:16px auto 0;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}
.tabbar button{flex:none;white-space:nowrap;border:none;background:transparent;color:#D9D2BC;font-family:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer}
.tabbar button.active{background:var(--amber);color:#241505}

.daily-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-top:20px; box-shadow:0 8px 24px rgba(18,33,59,.12); }
.daily-eyebrow{font-size:12px;color:var(--accent-fg);font-weight:600;margin-bottom:6px}
.daily-title{font-size:22px;font-weight:700;margin:0 0 6px}
.daily-usage{color:var(--fg-mut);font-size:14px;margin:0 0 14px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;gap:8px;align-items:flex-start;font-size:14px;direction:ltr;text-align:left}
.ex .mark{flex:none;width:20px;text-align:center;font-weight:700}
.ex.pos .mark{color:#3E8E5A} .ex.neg .mark{color:var(--danger)} .ex.q .mark{color:var(--accent-fg)}
.daily-btn{ margin-top:16px; width:100%; padding:12px; border:none; border-radius:10px; background:var(--amber); color:#241505; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; }
.daily-btn.done{background:transparent;border:1px solid var(--border);color:var(--fg-mut)}

.section-title{font-size:14px;font-weight:600;color:var(--fg-mut);margin:28px 4px 10px}
.group{display:flex;flex-direction:column;gap:10px}
.card{ background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.card-head .title-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.dot{flex:none;width:8px;height:8px;border-radius:50%}
.dot.done{background:var(--amber)} .dot.pending{background:var(--border)}
.card-head .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;font-size:13px;color:var(--fg-mut);transition:transform .2s ease}
.card.open .chev{transform:rotate(180deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
.card.open .card-body{max-height:1200px}
.card-body-inner{padding:0 16px 16px}
.usage{color:var(--fg-mut);font-size:13.5px;margin:0 0 12px}
.mini-btn{ margin-top:4px;font-size:13px;background:transparent;border:1px solid var(--border); color:var(--fg-mut);border-radius:8px;padding:8px 10px;width:100%;font-family:inherit;cursor:pointer; }
.mini-btn.done{color:var(--accent-fg);border-color:var(--accent-fg)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;font-family:inherit;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--fg-mut);cursor:pointer;white-space:nowrap}
.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.vcount{font-size:12px;color:var(--fg-mut);margin:4px 4px 14px}
.vcard{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; cursor:pointer; }
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vword{direction:ltr;text-align:left}
.vword .w{font-size:17px;font-weight:700}
.vword .ipa{font-size:13px;color:var(--fg-mut);margin-top:2px}
.vpos{font-size:11px;color:var(--teal-deep);background:rgba(46,110,107,.12);border-radius:6px;padding:2px 7px;flex:none}
.vbody{max-height:0;overflow:hidden;transition:max-height .25s ease}
.vcard.open .vbody{max-height:200px}
.vbody-inner{padding-top:12px;border-top:1px dashed var(--border);margin-top:12px}
.vfa{font-size:14.5px;margin:0 0 8px}
.vex{direction:ltr;text-align:left;font-size:13.5px;color:var(--fg-mut);margin:0 0 10px}

.tform{direction:ltr;text-align:left;font-size:13px;background:rgba(46,110,107,.12);border-radius:8px;padding:8px 10px;margin:0 0 12px}
.warn{font-size:13px;margin-top:12px;color:var(--danger)}
.tipbox{font-size:13px;margin-top:8px;color:var(--accent-fg)}
.tl{margin:0;padding:0 18px 12px 0;font-size:13.5px}
.tl li{margin-bottom:8px}

.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.qq{direction:ltr;text-align:left;font-size:14.5px;font-weight:600;margin:0 0 10px}
.opt{display:block;width:100%;direction:ltr;text-align:left;font-family:inherit;font-size:14px;padding:9px 12px;margin-bottom:6px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--fg);cursor:pointer}
.opt.ok{border-color:#3E8E5A;background:rgba(62,142,90,.18)}
.opt.bad{border-color:var(--danger);background:rgba(180,67,46,.14)}
.expl{font-size:13px;color:var(--fg-mut);margin-top:6px}
.score{font-size:15px;font-weight:600;margin:18px 4px 12px}
.lbl{font-size:12px;font-weight:600;color:var(--fg-mut);margin:12px 0 4px}
.hook{font-size:14px;font-weight:600;background:rgba(201,138,44,.16);border-radius:8px;padding:8px 10px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--fg);font-family:inherit;font-size:14px;margin-bottom:8px;direction:ltr;text-align:left}
.amsg{font-size:13px;color:var(--accent-fg);margin:8px 2px}
.hrow{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 2px;border-bottom:1px dashed var(--border)}
.acctbtn{border:none;background:var(--amber);color:#241505;font-family:inherit;font-size:13px;font-weight:700;border-radius:14px;padding:9px 13px;cursor:pointer;white-space:nowrap}
footer{text-align:center;color:var(--fg-mut);font-size:12px;margin-top:32px}
.hidden{display:none}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12213B">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app"></div>
<script>
var TENSES = [
 {id:'ps',group:'present',fa:'حال ساده',en:'Present Simple',usage:'حقایق ثابت، عادت‌ها، روتین روزانه',ex:[
   ['pos','She <b>works</b> in a hospital.'],
   ['neg','She <b>doesn&#39;t work</b> on Sundays.'],
   ['q','<b>Does</b> she <b>work</b> every day?']]},
 {id:'pc',group:'present',fa:'حال استمراری',en:'Present Continuous',usage:'کاری در همین لحظه، یا برنامه‌ی نزدیک آینده',ex:[
   ['pos','I <b>am studying</b> for IELTS right now.'],
   ['neg','They <b>aren&#39;t watching</b> TV at the moment.'],
   ['q','<b>Is</b> he <b>coming</b> to the party tonight?']]},
 {id:'pp',group:'present',fa:'حال کامل',en:'Present Perfect',usage:'تجربه، نتیجه در حال حاضر، کاری که ادامه دارد',ex:[
   ['pos','I <b>have visited</b> Paris twice.'],
   ['neg','She <b>hasn&#39;t finished</b> her homework yet.'],
   ['q','<b>Have</b> you <b>ever tried</b> sushi?']]},
 {id:'ppc',group:'present',fa:'حال کامل استمراری',en:'Present Perfect Continuous',usage:'تأکید روی تداوم فعالیت تا الان',ex:[
   ['pos','I <b>have been working</b> here since 2020.'],
   ['neg','He <b>hasn&#39;t been feeling</b> well lately.'],
   ['q','<b>Have</b> you <b>been waiting</b> long?']]},
 {id:'pas',group:'past',fa:'گذشته ساده',en:'Past Simple',usage:'کاری تمام‌شده در زمان مشخص گذشته',ex:[
   ['pos','She <b>graduated</b> in 2019.'],
   ['neg','We <b>didn&#39;t go</b> to the concert.'],
   ['q','<b>Did</b> they <b>arrive</b> on time?']]},
 {id:'pac',group:'past',fa:'گذشته استمراری',en:'Past Continuous',usage:'کاری در حال انجام در یک لحظه‌ی خاص گذشته',ex:[
   ['pos','I <b>was cooking</b> when the phone rang.'],
   ['neg','They <b>weren&#39;t listening</b> during the lecture.'],
   ['q','What <b>were</b> you <b>doing</b> at 8pm?']]},
 {id:'pap',group:'past',fa:'گذشته کامل',en:'Past Perfect',usage:'کاری که قبل از یک اتفاق دیگر در گذشته تمام شده',ex:[
   ['pos','By the time I arrived, she <b>had left</b>.'],
   ['neg','He <b>hadn&#39;t finished</b> the report before the meeting.'],
   ['q','<b>Had</b> you <b>ever seen</b> snow before that trip?']]},
 {id:'papc',group:'past',fa:'گذشته کامل استمراری',en:'Past Perfect Continuous',usage:'تداوم یک فعالیت تا لحظه‌ای مشخص در گذشته',ex:[
   ['pos','They <b>had been driving</b> for hours before they stopped.'],
   ['neg','She <b>hadn&#39;t been sleeping</b> well before the exam.'],
   ['q','<b>Had</b> he <b>been studying</b> long before the test?']]},
 {id:'fs',group:'future',fa:'آینده ساده',en:'Future Simple',usage:'تصمیم لحظه‌ای، پیش‌بینی، قول',ex:[
   ['pos','I <b>will call</b> you tomorrow.'],
   ['neg','It <b>won&#39;t rain</b> this weekend.'],
   ['q','<b>Will</b> you <b>help</b> me with this?']]},
 {id:'fc',group:'future',fa:'آینده استمراری',en:'Future Continuous',usage:'کاری در حال انجام در یک لحظه‌ی مشخص آینده',ex:[
   ['pos','This time next week, I <b>will be traveling</b>.'],
   ['neg','We <b>won&#39;t be working</b> on Friday.'],
   ['q','<b>Will</b> you <b>be attending</b> the seminar?']]},
 {id:'fp',group:'future',fa:'آینده کامل',en:'Future Perfect',usage:'کاری که تا یک زمان مشخص در آینده تمام شده',ex:[
   ['pos','By 2027, I <b>will have graduated</b>.'],
   ['neg','She <b>won&#39;t have finished</b> the project by June.'],
   ['q','<b>Will</b> they <b>have completed</b> the survey by then?']]},
 {id:'fpc',group:'future',fa:'آینده کامل استمراری',en:'Future Perfect Continuous',usage:'تداوم فعالیت تا یک نقطه‌ی مشخص در آینده',ex:[
   ['pos','By December, I <b>will have been living</b> here for 5 years.'],
   ['neg','He <b>won&#39;t have been working</b> here for a year yet.'],
   ['q','<b>Will</b> you <b>have been studying</b> for 3 hours by 6pm?']]}
];
var GROUPS = [['present','حال'],['past','گذشته'],['future','آینده']];

var TOPICS = [
 {id:'t_cond',fa:'شرطی‌ها',en:'Conditionals',usage:'Zero: حقایق | First: احتمال واقعی آینده | Second: فرض غیرواقعی حال | Third: حسرت گذشته | Mixed: شرط گذشته، نتیجه حال',form:'If + present, will | If + past, would | If + had + pp, would have + pp',ex:['If you <b>heat</b> ice, it <b>melts</b>.','If governments <b>invested</b> more in rail, emissions <b>would fall</b>.','If I <b>had revised</b>, I <b>would have passed</b>.','If she <b>had accepted</b> the job, she <b>would be</b> living abroad now.'],mistake:'If I will have time, I will come ✘ → If I have time, I will come ✔ (بعد از if زمان آینده نمی‌آید)',tip:'در Task 2 برای راه‌حل‌های فرضی از Second Conditional استفاده کن؛ نشانهٔ دامنهٔ گرامری Band 7+ است.'},
 {id:'t_pass',fa:'مجهول',en:'Passive Voice',usage:'وقتی عامل کار مهم یا مشخص نیست، یا تأکید روی خود کار است',form:'be + past participle (is done / was done / has been done / is being done)',ex:['The bridge <b>was built</b> in 1990.','Plastic waste <b>is being dumped</b> into oceans.','The law <b>has been criticised</b> by experts.','It <b>is believed</b> that crime will rise.'],mistake:'The accident was happened ✘ → The accident happened ✔ (افعال لازم مثل happen, occur, arise مجهول نمی‌شوند)',tip:'در Task 1 (Process) استفاده از مجهول تقریباً الزامی است.'},
 {id:'t_modal',fa:'افعال وجهی',en:'Modal Verbs',usage:'توانایی، احتمال، الزام، توصیه، استنباط',form:'modal + base verb (بدون to) | modal + have + pp (گذشته)',ex:['Governments <b>should</b> invest in renewable energy.','Excessive screen time <b>may</b> harm children.','Students <b>must</b> submit the form by Friday.','She <b>can&#39;t have</b> left; her coat is still here.'],mistake:'He can to swim ✘ / must to go ✘ → بعد از modal مصدر بدون to',tip:'Hedging با may / might / tend to برای ادعاهای محتاطانه، نشانهٔ نوشتار آکادمیک است: "This may lead to..."'},
 {id:'t_rel',fa:'جملات موصولی',en:'Relative Clauses',usage:'Defining (ضروری، بدون ویرگول) و Non-defining (اطلاعات اضافه، با ویرگول)',form:'noun + who / which / that / whose / where + clause',ex:['People <b>who</b> exercise regularly live longer.','The study, <b>which</b> involved 500 adults, was published last year.','The city <b>where</b> I grew up has changed.','It is a factor <b>whose</b> impact is often underestimated.'],mistake:'The man who he called ✘ → The man who called ✔ (ضمیر اضافی «که او» ممنوع)',tip:'در non-defining از that استفاده نکن؛ فقط who/which.'},
 {id:'t_rep',fa:'نقل قول غیرمستقیم',en:'Reported Speech',usage:'بازگویی حرف دیگران؛ زمان‌ها یک گام به عقب می‌روند (backshift)',form:'said (that) + past | told + object | asked + if/whether',ex:['She said she <b>was</b> tired.','He told me that he <b>had finished</b>.','They asked whether I <b>could</b> help.','The report claimed that prices <b>would rise</b>.'],mistake:'He said me ✘ → He told me ✔ / He said to me ✔',tip:'در Speaking Part 2 برای بازگویی مکالمه‌های گذشته کاربرد دارد.'},
 {id:'t_art',fa:'حروف تعریف',en:'Articles',usage:'a/an: اولین ذکر، مفرد قابل‌شمارش | the: مشخص/یکتا | بدون حرف تعریف: جمع و غیرقابل‌شمارش در معنای کلی',form:'a + consonant sound | an + vowel sound | the (specific) | zero (general)',ex:['Children need <b>a</b> balanced diet.','<b>The</b> number of cars has risen.','Technology plays an important role in modern life.','She is <b>the</b> best student in <b>the</b> class.'],mistake:'The life is difficult ✘ → Life is difficult ✔ | a information ✘ → some information ✔',tip:'رایج‌ترین خطای فارسی‌زبان‌ها؛ قبل از ارسال Writing، تک‌تک اسم‌ها را از نظر حرف تعریف چک کن.'},
 {id:'t_ger',fa:'مصدر و ing',en:'Gerund & Infinitive',usage:'برخی افعال ing می‌گیرند، برخی to، و برخی معنی‌شان فرق می‌کند',form:'enjoy / avoid / suggest + -ing | decide / want / hope + to | stop / remember / try (تغییر معنی)',ex:['I <b>enjoy reading</b> novels.','She <b>decided to leave</b>.','He <b>stopped smoking</b>. / He <b>stopped to smoke</b>.','I look forward to <b>meeting</b> you.'],mistake:'I look forward to meet ✘ → meeting ✔ (to در اینجا حرف اضافه است)',tip:'بعد از حروف اضافه همیشه -ing: interested in, capable of, by + -ing.'},
 {id:'t_comp',fa:'مقایسه',en:'Comparatives & Superlatives',usage:'مقایسهٔ دو یا چند مورد؛ در Task 1 بسیار پرکاربرد',form:'-er / more + adj + than | the -est / the most + adj | the + comparative, the + comparative',ex:['Cars are <b>far more expensive than</b> bikes.','<b>The higher</b> the price, <b>the lower</b> the demand.','Sales rose <b>twice as fast as</b> costs.','This is <b>by far the most</b> effective solution.'],mistake:'more better ✘ / more cheaper ✘ → better / cheaper ✔',tip:'تقویت‌کننده‌های مقایسه: considerably, significantly, slightly, marginally.'},
 {id:'t_inv',fa:'وارونگی',en:'Inversion',usage:'تأکید رسمی؛ بعد از قید منفی یا محدودکننده فاعل و فعل کمکی جابه‌جا می‌شوند',form:'Negative adverbial + auxiliary + subject + verb',ex:['<b>Never have</b> I seen such progress.','<b>Not only</b> does it save money, <b>but</b> it also protects nature.','<b>Rarely do</b> teenagers read newspapers.','<b>Only when</b> prices fall will demand recover.'],mistake:'Never I have seen ✘ → Never have I seen ✔',tip:'حداکثر ۱ یا ۲ مورد در کل مقاله؛ زیاده‌روی غیرطبیعی به نظر می‌رسد.'},
 {id:'t_cleft',fa:'جملات تأکیدی',en:'Cleft Sentences',usage:'برجسته‌کردن یک بخش از جمله',form:'It is/was + focus + that... | What + clause + is...',ex:['<b>It is</b> education <b>that</b> drives economic growth.','<b>What</b> concerns me most <b>is</b> the cost.','<b>It was</b> in 2010 <b>that</b> prices peaked.'],mistake:'استفاده بیش از حد؛ یکی دو بار در مقاله کافی است',tip:'در Speaking Part 3: "What I find most striking is..." طبیعی و Band 8-ish است.'},
 {id:'t_part',fa:'عبارت‌های وصفی',en:'Participle Clauses',usage:'فشرده‌سازی جمله با -ing / -ed برای نوشتار آکادمیک',form:'V-ing (فعال) | V-ed (مجهول) | Having + pp (پیش از)',ex:['<b>Having completed</b> the survey, researchers analysed the data.','Cities <b>built</b> near rivers flourished.','<b>Working</b> long hours, many employees feel exhausted.'],mistake:'Walking down the street, the rain started ✘ (فاعل هر دو بخش باید یکی باشد)',tip:'یکی از بهترین ابزارها برای Grammatical Range در Band 8.'},

 {id:'k_goal',t:'هدف ۸.۵ یعنی چه؟',items:['نمرهٔ کل میانگین چهار مهارت است و به نزدیک‌ترین نیم‌نمره گرد می‌شود (مثلاً میانگین ۸.۲۵ می‌شود ۸.۵).','Listening و Reading برای ۸.۵ تقریباً به ۳۸–۳۹ از ۴۰ نیاز دارند (جدول دقیق هر آزمون کمی فرق می‌کند).','Writing و Speaking معمولاً سخت‌ترین مهارت‌ها هستند؛ برنامهٔ تمرین را بر اساس ضعیف‌ترین مهارت ببند.','هر چهار مهارت وزن برابر دارند؛ یک مهارت ضعیف، نمرهٔ کل را می‌کشد پایین.']},
 {id:'k_wr',t:'Writing',items:['Task 1: حتماً Overview بنویس (روند کلی بدون عدد)؛ بدون آن Task Achievement بالا نمی‌رود.','حداقل ۱۵۰ کلمه (Task 1) و ۲۵۰ کلمه (Task 2)؛ کمتر از این جریمه دارد.','Task 2 وزن بیشتری دارد: حدود ۴۰ دقیقه برای Task 2 و ۲۰ دقیقه برای Task 1.','Task 2: به همهٔ بخش‌های سؤال جواب بده و موضعت را در مقدمه و نتیجه یکسان نگه دار.','هر پاراگراف بدنه: ایدهٔ اصلی ← توضیح ← مثال مشخص (نه کلی‌گویی).','۳–۵ دقیقه برنامه‌ریزی؛ جملهٔ ساده و بدون خطا بهتر از جملهٔ پیچیدهٔ خطادار است.','مقاله حفظ‌شده تشخیص داده می‌شود و جریمه دارد.']},
 {id:'k_sp',t:'Speaking',items:['Part 1: جواب ۲–۳ جمله: پاسخ + دلیل + مثال کوتاه (نه یک کلمه).','Part 2: ۱ دقیقه آماده‌سازی؛ ۴–۵ کلمهٔ کلیدی بنویس و ۱.۵ تا ۲ دقیقه کامل صحبت کن.','Part 3: نظر بده، گذشته و حال را مقایسه کن، آینده را حدس بزن: "I would argue that...", "It largely depends on..."','برای فکرکردن از fillers طبیعی استفاده کن: "Well,", "Let me think..."؛ خوداصلاحی طبیعی عیب نیست.','جواب حفظ‌شده را مصحح می‌فهمد؛ روان‌بودن و طبیعی‌بودن مهم‌تر از لغات سنگین است.','تلفظ: تکیهٔ کلمه (word stress) و آهنگ جمله از تک‌تک صداها مهم‌ترند.']},
 {id:'k_rd',t:'Reading',items:['۲۰ دقیقه برای هر Passage؛ روی یک سؤال گیر نکن و بعداً برگرد.','اول سؤال‌ها را بخوان، بعد scanning برای کلمات کلیدی؛ جواب معمولاً به ترتیب متن است (به‌جز Matching Headings / Information).','True/False/Not Given: False یعنی متن خلاف را می‌گوید؛ Not Given یعنی متن دربارهٔ آن حرفی نزده. با دانش خودت جواب نده.','جواب با همان کلمات سؤال نیست؛ دنبال paraphrase و مترادف بگرد.','رعایت تعداد کلمات مجاز (NO MORE THAN TWO WORDS) و املا الزامی است؛ غلط املایی = غلط.','در Reading زمان اضافه برای انتقال جواب نداری؛ همان لحظه در پاسخنامه بنویس.']},
 {id:'k_ls',t:'Listening',items:['قبل از پخش، سؤال‌ها را بخوان و نوع جواب (عدد، اسم، صفت) را پیش‌بینی کن.','Distractor: گوینده اول چیزی می‌گوید و بعد اصلاح می‌کند (Actually..., On second thought...)؛ جواب نهایی را بنویس.','اعداد، تاریخ‌ها و املای اسم‌ها را جدا تمرین کن؛ حروف مشابه مثل G/J و E/I را تمرین کن.','جمع/مفرد و املا را چک کن؛ جواب باید از نظر گرامری در جمله جا بیفتد.','در نسخهٔ کاغذی ۱۰ دقیقه برای انتقال جواب هست و در نسخهٔ کامپیوتری حدود ۲ دقیقه برای بازبینی.','وقتی یک سؤال را از دست دادی ادامه بده؛ فکر کردن به آن، سؤال بعدی را هم از دست می‌دهد.']}

 {id:'s3',t:'Part 3: بحث انتزاعی',items:['فرمول: نظر + دلیل + مقایسه یا مثال + نتیجه.','شروع نظر: I would say that... | From my perspective... | It largely depends on...','مقایسهٔ گذشته و حال: Compared with the past, ... | These days, ...','حدس آینده: I suspect that... | It is likely that... | In the long run, ...','موافقت جزئی: That is partly true, but... | Up to a point.','سؤال را نفهمیدی؟ Could you rephrase that, please? (جریمه ندارد.)']},

 {id:'r1',t:'Reading: انواع سؤال',items:['True/False/Not Given: موافق متن = True | مخالف = False | متن اصلاً نگفته = Not Given.','Matching Headings: اول ایدهٔ اصلی هر پاراگراف را پیدا کن (معمولاً جملهٔ اول و آخر)، بعد تیتر را انتخاب کن.','Summary/Sentence Completion: نوع کلمه (اسم، فعل، صفت) را از ساختار جمله حدس بزن.','Matching Information: سؤال‌ها به ترتیب متن نیستند؛ کلمهٔ کلیدی را در کل متن پیدا کن.','Multiple Choice: گزینه‌ها را حذف کن؛ گزینه‌ای که فقط بخشی از متن را پوشش می‌دهد معمولاً دام است.','Yes/No/Not Given: مثل T/F/NG ولی دربارهٔ نظر نویسنده.']},
 {id:'r2',t:'Reading: Paraphrase',items:['متن و سؤال هیچ‌وقت کلمات یکسان ندارند؛ مترادف و تغییر ساختار را دنبال کن.','rise sharply = increase dramatically | cause = lead to / result in | important = crucial / vital | because of = owing to','Not Given با False فرق دارد؛ اگر متن بحث نکرده، جواب دانش خودت نیست.','کلمات هشداردار: all, never, only, always, must؛ قیدهای مطلق معمولاً جواب را False می‌کنند.','تمرین روزانه: هر روز ۳ جمله بخوان و با کلمات خودت بازنویسی کن.']},
 {id:'r3',t:'Listening: بخش‌ها و دام‌ها',items:['Section 1: مکالمهٔ روزمره (فرم) | 2: تک‌گویی عمومی | 3: بحث دانشگاهی | 4: سخنرانی آکادمیک.','تغییر پاسخ: گوینده می‌گوید Actually, ... یا No, sorry, it is... ← جواب آخر را بنویس.','املا: حرف Z، اسامی با حرف دوبل (Cooper)، و اعداد ۱۳ و ۳۰ (thirTEEN / THIRty).','Map labeling: عبارت‌های مکان را یاد بگیر: opposite, next to, behind, on the left of.','در چندگزینه‌ای، مترادف گزینه‌ها را در گفتار گوش بده، نه خود کلمه را.','اگر یک پاسخ را گم کردی رهایش کن؛ سؤال بعدی مهم‌تر است.']},
 {id:'r4',t:'تمرین Reading: متن و سؤال اصلی (با پاسخ)',items:['<b>The Four-Day Week: Experiment or Future?</b><br><span dir=ltr>In recent years, a growing number of companies have tested a four-day working week, in which employees receive full pay for roughly thirty-two hours of work. Early trials were small and mostly limited to technology firms, but larger pilot programmes have since involved dozens of organisations in several countries. Supporters argue that shorter weeks reduce stress and absenteeism, and that workers who are better rested tend to concentrate more effectively. In many trials, managers reported that productivity stayed the same or even improved, partly because meetings were shortened and unnecessary tasks were removed.<br><br>Critics, however, point out that the model does not suit every sector. Hospitals, restaurants and emergency services must operate continuously, and compressing hours into fewer days can lead to longer, more tiring shifts. Some economists also warn that results from voluntary trials may be unreliable, since companies that volunteer are usually those most likely to succeed.<br><br>Despite these doubts, the idea continues to spread. Several governments are now considering whether shorter working weeks could help reduce unemployment by sharing available work among more people. Whether the four-day week will become standard remains uncertain, but few observers believe the debate will disappear.</span>','<b>Q1-4 (True / False / Not Given):</b> 1) Early trials were mainly carried out in technology companies. 2) Managers in many trials reported lower productivity. 3) Most employees in the trials said they preferred the four-day week. 4) Voluntary trials may give misleading results.','<b>Q5-6 (یک کلمه):</b> 5) Compressing hours into fewer days can lead to longer, more ___ shifts. 6) Some governments think a shorter week might reduce ___ by sharing work.','<b>Q7 (Multiple Choice):</b> What is the main purpose of the passage? A) to promote the four-day week B) to present both the benefits and limits of an idea C) to prove that productivity always rises D) to criticise companies','<details><summary>پاسخ و توضیح (اول خودت حل کن)</summary>1) <b>True</b>: متن می‌گوید early trials mostly limited to technology firms.<br>2) <b>False</b>: متن می‌گوید productivity ثابت ماند یا بهتر شد.<br>3) <b>Not Given</b>: متن دربارهٔ ترجیح کارکنان حرفی نزده؛ فقط نظر مدیران آمده.<br>4) <b>True</b>: some economists warn that results from voluntary trials may be unreliable ← paraphrase: misleading = unreliable.<br>5) <b>tiring</b>. 6) <b>unemployment</b>.<br>7) <b>B</b>: متن هم مزایا و هم محدودیت‌ها را می‌گوید؛ A و D یک‌طرفه‌اند و C با کلمهٔ always افراطی است (دام).</details>']}
];

 {id:'y0',t:'درباره این بخش (حتماً بخوان)',items:['سؤال‌های رسمی آزمون محرمانه و دارای حق کپی‌رایت‌اند و منتشر نمی‌شوند؛ پس متن اصلی آن‌ها را نمی‌شود اضافه کرد.','این موضوع‌ها را داوطلبان در سال ۲۰۲۶ گزارش کرده‌اند و متن هر سؤال را من به‌صورت تمرین بازنویسی کرده‌ام؛ عین سؤال آزمون نیست.','پاسخ‌ها نمونهٔ طرح و استدلال‌اند، نه نمرهٔ رسمی.','در آزمون واقعی سؤال دقیقاً تکرار نمی‌شود، ولی موضوع و نوع سؤال تکرار می‌شود؛ پس تمرین روی موضوع مهم است.','هر مقاله را در ۴۰ دقیقه بنویس و بعد با طرح نمونه مقایسه کن یا برای تصحیح برای من بفرست.']},
 {id:'y1',t:'۱) سلامت: درمان خودسرانه',items:['<b>Prompt:</b> <span dir=ltr>Some people treat minor illnesses themselves instead of seeing a doctor. Is this a positive or negative development?</span>','نوع سؤال: Positive/Negative','Thesis نمونه: این روند بیشتر منفی است، هرچند برای بیماری‌های خفیف فایده دارد.','بدنه ۱: خطرها: تشخیص اشتباه، دیرشدن درمان بیماری جدی، مصرف بی‌رویهٔ آنتی‌بیوتیک و مقاومت دارویی.','بدنه ۲: فایده‌ها: صرفه‌جویی در وقت و کم‌شدن فشار روی درمانگاه‌ها برای مشکلات جزئی؛ اما خطرها سنگین‌ترند.','عبارات مفید: self-medication, misdiagnosis, antibiotic resistance, minor ailments, place a burden on','نکتهٔ نمره: خفیف و جدی را از هم جدا کن؛ نشان‌دهندهٔ استدلال دقیق است.']},
 {id:'y2',t:'۲) بودجهٔ دولت: حمایت از هنرمندان',items:['<b>Prompt:</b> <span dir=ltr>Some people think governments should fund artists, while others believe the money should go to essential services. Discuss both views and give your opinion.</span>','نوع سؤال: Discussion + Opinion','Thesis نمونه: هر دو مهم‌اند ولی خدمات ضروری اولویت دارند و هنر باید بودجهٔ محدود بگیرد.','بدنه ۱: طرفداران هنر: میراث فرهنگی، جذب گردشگر، سلامت روان و انسجام اجتماعی.','بدنه ۲: طرفداران خدمات ضروری: درمان و آموزش نیاز اولیه‌اند و بودجه محدود است (opportunity cost).','عبارات مفید: public funding, cultural heritage, allocate resources, essential services, opportunity cost','نکتهٔ نمره: در Discussion حتماً نظر خودت را در intro و conclusion بگو.']},
 {id:'y3',t:'۳) آموزش: اولویت بودجه',items:['<b>Prompt:</b> <span dir=ltr>Education budgets should reflect each country&#39;s specific needs rather than global trends. To what extent do you agree?</span>','نوع سؤال: Opinion','Thesis نمونه: تا حد زیادی موافقم؛ نیازها فرق دارد، هرچند استانداردهای مشترک مفیدند.','بدنه ۱: نیازها متفاوت است: کشوری با مشکل سواد پایه در برابر کشوری که مهارت‌های پیشرفته می‌خواهد.','بدنه ۲: روندهای جهانی گمراه‌کننده‌اند: ابزار دیجیتال بدون برق و زیرساخت بی‌فایده است؛ ولی استاندارد مشترک مقایسه را ممکن می‌کند.','عبارات مفید: allocate, tailored to, literacy rates, infrastructure, one-size-fits-all','نکتهٔ نمره: To what extent یعنی درجهٔ موافقت را مشخص کن (largely / partly).']},
 {id:'y4',t:'۴) ایمنی جاده: تخلف رانندگی',items:['<b>Prompt:</b> <span dir=ltr>Traffic violations are increasing in many cities. What are the causes, and what solutions can be taken?</span>','نوع سؤال: Causes + Solutions','Thesis نمونه: علت‌ها: نظارت ضعیف، حواس‌پرتی و طراحی بد جاده؛ راه‌حل‌ها: اجرای سخت‌گیرانه‌تر، آموزش، اصلاح راه‌ها.','بدنه ۱: علت‌ها: رانندهٔ حواس‌پرت (موبایل)، جریمهٔ کم و نظارت ضعیف، تقاطع‌ها و علائم نامناسب.','بدنه ۲: راه‌حل‌ها: دوربین و جریمهٔ سنگین‌تر، کمپین ایمنی و آموزش، بازطراحی جاده؛ هر راه‌حل را به یک علت وصل کن.','عبارات مفید: reckless driving, distracted driving, enforce, penalty, road safety campaign','نکتهٔ نمره: هر راه‌حل باید به یک علت مشخص ربط داشته باشد.']},
 {id:'y5',t:'۵) مسئولیت‌پذیری در کودکی',items:['<b>Prompt:</b> <span dir=ltr>Many children today are given little responsibility at home. What problems may this cause in adulthood, and how can parents help?</span>','نوع سؤال: Problem/Solution','Thesis نمونه: کم‌مسئولیتی در کودکی باعث وابستگی و ضعف تصمیم‌گیری می‌شود؛ والدین با واگذاری تدریجی کار می‌توانند کمک کنند.','بدنه ۱: مشکل‌ها: نبود استقلال، تصمیم‌گیری ضعیف، فشار روانی در کار و زندگی مستقل.','بدنه ۲: راه‌حل‌ها: واگذاری کارهای خانه، اجازهٔ اشتباه‌کردن، افزایش تدریجی استقلال.','عبارات مفید: independence, self-reliant, accountability, instil a sense of responsibility, shield children from','نکتهٔ نمره: پیامدها را بلندمدت و مشخص توضیح بده (کار، روابط، مدیریت مالی).']},
 {id:'y6',t:'۶) هوش مصنوعی در آموزش و کار',items:['<b>Prompt:</b> <span dir=ltr>Artificial intelligence is increasingly used in education and workplaces. Do the advantages outweigh the disadvantages?</span>','نوع سؤال: Advantages/Disadvantages (outweigh)','Thesis نمونه: مزایا بیشتر است به شرط قانون‌گذاری و نظارت.','بدنه ۱: مزایا: یادگیری شخصی‌سازی‌شده، افزایش بهره‌وری، خودکارشدن کارهای تکراری.','بدنه ۲: معایب: از دست رفتن شغل، وابستگی بیش از حد، حریم خصوصی، تقلب علمی.','عبارات مفید: automate, personalised learning, over-reliance, job displacement, data privacy','نکتهٔ نمره: برای outweigh حتماً قضاوت کن؛ فقط فهرست‌کردن کافی نیست.']},
 {id:'y7',t:'۷) آموزش آنلاین یا کلاس حضوری',items:['<b>Prompt:</b> <span dir=ltr>Some people believe online learning will replace classroom teaching. To what extent do you agree?</span>','نوع سؤال: Opinion','Thesis نمونه: تا حدی مخالفم؛ آموزش ترکیبی (blended) بهتر است.','بدنه ۱: نقاط قوت آنلاین: انعطاف، دسترسی، هزینهٔ کمتر.','بدنه ۲: نقاط قوت حضوری: تعامل مستقیم، انضباط، مهارت‌های عملی و نیاز کودکان به معلم.','عبارات مفید: blended learning, flexibility, face-to-face interaction, self-discipline, digital divide','نکتهٔ نمره: موضع میانه هم قابل قبول است، به شرط استدلال روشن.']},
 {id:'y8',t:'۸) مسئولیت مشکلات اجتماعی',items:['<b>Prompt:</b> <span dir=ltr>Some people think governments alone are responsible for solving social problems such as poverty and crime. To what extent do you agree?</span>','نوع سؤال: Opinion','Thesis نمونه: با مسئولیت انحصاری دولت مخالفم؛ دولت رهبری می‌کند ولی مشارکت دیگران لازم است.','بدنه ۱: نقش دولت: قانون، بودجه و خدمات عمومی.','بدنه ۲: نقش دیگران: خیریه‌ها، جامعهٔ محلی، بخش خصوصی و داوطلبان.','عبارات مفید: collective responsibility, civil society, grassroots, public-private partnership, NGOs','نکتهٔ نمره: alone در سؤال کلیدی است؛ مستقیم به آن جواب بده.']}
];

 {id:'p0',t:'درباره این بخش (حتماً بخوان)',items:['سؤال‌های رسمی Speaking منتشر نمی‌شوند؛ این موضوع‌ها را داوطلبان در ۲۰۲۶ گزارش کرده‌اند و موضوع‌ها در چرخه‌های چندماهه تکرار می‌شوند.','متن cue cardها را خودم به‌صورت تمرین نوشته‌ام و عین کارت آزمون نیست.','برای هر کارت یک طرح پاسخ، عبارت مفید و سؤال‌های احتمالی Part 3 هست؛ پاسخ حفظی ننویس.','هر کارت را با ۱ دقیقه آمادگی و ۲ دقیقه صحبت تمرین کن و صدایت را ضبط کن.']},
 {id:'p1',t:'۱) کمک به یک نفر',items:['<b>Cue card:</b> Describe a time when you helped someone.','You should say: who you helped, what the problem was, how you helped, how you felt','طرح پاسخ: معرفی (چه کسی، چه موقع) ← مشکل ← کاری که کردی ← نتیجه و احساس.','عبارات مفید: lend a hand, go out of my way, in need, it meant a lot to him, rewarding','Part 3 احتمالی: Why do some people not help others? | Should schools teach children to volunteer?','نکتهٔ نمره: از زمان گذشته درست استفاده کن (was having, had lost) و احساس را با جزئیات بگو.']},
 {id:'p2',t:'۲) فردی که الهام‌بخش یادگیری است',items:['<b>Cue card:</b> Describe a person who inspires you to learn new things.','You should say: who the person is, how you know them, what they have taught you, why they inspire you','طرح پاسخ: او کیست ← چه چیزی یاد داده ← یک موقعیت مشخص ← اثر روی من.','عبارات مفید: role model, set an example, curious, push me out of my comfort zone, self-taught','Part 3 احتمالی: Do people learn better from teachers or by themselves? | How will learning change in future?','نکتهٔ نمره: یک مثال واقعی و مشخص از اثر آن فرد بیاور، نه تعریف کلی.']},
 {id:'p3',t:'۳) مکانی که تغییر کرده',items:['<b>Cue card:</b> Describe a place that has changed.','You should say: where it is, what it was like before, how it has changed, how you feel about it','طرح پاسخ: قبلاً چطور بود (used to) ← چه تغییری کرد ← چرا ← نظر من.','عبارات مفید: used to be, has transformed, redeveloped, lost its charm, urbanisation','Part 3 احتمالی: Why do cities change so fast? | Should old buildings be preserved?','نکتهٔ نمره: used to و present perfect را کنار هم بیاور تا range گرامری نشان داده شود.']},
 {id:'p4',t:'۴) قولی که باید نگه می‌داشتی',items:['<b>Cue card:</b> Describe a promise you made that was important to keep.','You should say: what the promise was, who you made it to, why it was important, whether you kept it','طرح پاسخ: قول چه بود ← به چه کسی ← چرا مهم بود ← چگونه نگهش داشتم.','عبارات مفید: keep my word, give my word, reliable, trustworthy, let someone down','Part 3 احتمالی: Why do people break promises? | Is trust more important than honesty?','نکتهٔ نمره: اگر نگه نداشتی هم مشکلی نیست؛ داستان و احساس مهم است.']},

  session = {access_token: r.access_token, refresh_token: r.refresh_token, expires_at: Math.floor(Date.now()/1000) + (r.expires_in || 3600), user: {id: r.user.id, email: r.user.email}};

async function getToken(){
  if(!session) return null;
  if(session.expires_at - 60 > Date.now()/1000) return session.access_token;
  var r = await sbFetch('/auth/v1/token?grant_type=refresh_token', {method:'POST', body:{refresh_token: session.refresh_token}});
  if(!r.ok){ session = null; save('haman_session', null); return null; }
  setSession(await r.json());
  return session.access_token;
}

function dayIndex(len){
  var d = new Date(); var start = new Date(d.getFullYear(),0,0);
  var diff = d - start; return Math.floor(diff / 86400000) % len;
}
function todayStr(){ var d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function updateStreak(){
  var last = load('haman_last_visit', null); var streak = load('haman_streak', 0); var today = todayStr();
  if(last !== today){
    var y = new Date(Date.now()-86400000);
    var yStr = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    streak = (last === yStr) ? streak + 1 : 1;
    save('haman_streak', streak); save('haman_last_visit', today);
  }
  return streak;
}

  html += '</div>';
  var sy = window.scrollY; app.innerHTML = html;
  bind(); window.scrollTo(0, sy);
}

function bind(){
  var app = document.getElementById('app');
  app.querySelectorAll('[data-view]').forEach(function(el){
    el.addEventListener('click', function(){ view = el.getAttribute('data-view'); render(); });
  });
  app.querySelectorAll('[data-toggle]').forEach(function(el){
    el.addEventListener('click', function(){ el.closest('.card').classList.toggle('open'); });
  });
  var tBtn = app.querySelector('[data-today-toggle]');
  if(tBtn){ tBtn.addEventListener('click', function(){ gDone[todayTense.id] = !gDone[todayTense.id]; save('haman_done', gDone); render(); }); }
  app.querySelectorAll('[data-toggle-done]').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); var id = el.getAttribute('data-toggle-done'); gDone[id] = !gDone[id]; save('haman_done', gDone); render(); });
  });
  var twBtn = app.querySelector('[data-today-word-toggle]');
  if(twBtn){ twBtn.addEventListener('click', function(){ vDone[todayWord.w] = !vDone[todayWord.w]; save('haman_vocab_done', vDone); render(); }); }
  app.querySelectorAll('[data-cat]').forEach(function(el){
    el.addEventListener('click', function(){ activeCat = el.getAttribute('data-cat'); render(); });
  });
  app.querySelectorAll('[data-vtoggle]').forEach(function(el){
    el.addEventListener('click', function(){ el.closest('.vcard').classList.toggle('open'); });
  });
  app.querySelectorAll('[data-vdone]').forEach(function(el){
    el.addEventListener('click', function(e){ e.stopPropagation(); var w = el.getAttribute('data-vdone'); vDone[w] = !vDone[w]; save('haman_vocab_done', vDone); render(); });
  });
  app.querySelectorAll('[data-qo]').forEach(function(el){
    el.addEventListener('click', function(){ var q = +el.getAttribute('data-q'); if(quizAns[q]===undefined){ quizAns[q] = +el.getAttribute('data-qo'); render(); if(Object.keys(quizAns).length === QUIZ.length){ var sc = 0; QUIZ.forEach(function(x,i){ if(quizAns[i] === x.a) sc++; }); recordQuiz(sc); } } });
  });
  app.querySelectorAll('[data-auth]').forEach(function(el){
    el.addEventListener('click', function(){
      var m = el.getAttribute('data-auth');
      if(m === 'in' || m === 'up') doAuth(m);
      else if(m === 'google'){ location.href = SB_URL + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(location.origin + location.pathname); }
      else if(m === 'sync'){ authMsg = 'در حال همگام‌سازی...'; render(); pullMerge().then(function(){ authMsg = 'همگام‌سازی شد.'; render(); }); }
      else if(m === 'out'){ session = null; save('haman_session', null); quizHist = []; authMsg = 'خارج شدید.'; render(); }
    });
  });
  var qr = app.querySelector('[data-qreset]');
  if(qr){ qr.addEventListener('click', function(){ quizAns = {}; render(); }); }
}
async function handleHash(){
  var h = location.hash ? location.hash.slice(1) : ''; if(!h) return;
  var p = {};
  h.split('&').forEach(function(kv){ var a = kv.split('='); p[a[0]] = decodeURIComponent((a[1] || '').replace(/\+/g, ' ')); });
  if(p.error_description){ authMsg = 'خطا: ' + p.error_description + ' | اگر قبلاً ثبت‌نام کرده‌اید، مستقیم وارد شوید.'; view = 'acct'; history.replaceState(null, '', location.pathname); render(); return; }
  if(p.access_token){
    try{
      var r = await sbFetch('/auth/v1/user', {}, p.access_token);
      if(r.ok){ var u = await r.json(); setSession({access_token: p.access_token, refresh_token: p.refresh_token, expires_in: +p.expires_in || 3600, user: u}); view = 'acct'; authMsg = 'ایمیل تأیید شد و وارد شدید.'; }
    }catch(e){}
    history.replaceState(null, '', location.pathname);
    await pullMerge();
  }
}
render();
if(session){ pullMerge(); }
handleHash();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
